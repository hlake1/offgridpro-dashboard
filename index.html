<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweak Reporting — Client Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --tw-dark: #0f172a;
    --tw-text: #1a1a1a;
    --tw-muted: #666;
    --tw-accent-1: #a3c94a;
    --tw-accent-2: #4bc7bf;
    --tw-accent-3: #5aa5d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Montserrat', -apple-system, Helvetica, Arial, sans-serif;
    color: var(--tw-text);
    background:
      linear-gradient(rgba(15,23,42,0.85) 0%, rgba(10,10,10,0.92) 100%),
      linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
  }
  body::before, body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.25;
    pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    background: var(--tw-accent-2);
    top: -100px; left: -100px;
  }
  body::after {
    width: 600px; height: 600px;
    background: var(--tw-accent-1);
    bottom: -150px; right: -150px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    color: var(--tw-text);
    border-radius: 6px;
    padding: 2.75rem 2.25rem 2.25rem;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
  }
  .brand-row { display: flex; align-items: baseline; gap: 0.4rem; }
  .brand { font-weight: 800; letter-spacing: -0.01em; font-size: 1.35rem; }
  .accent-bar {
    height: 4px; margin-top: 8px;
    background: linear-gradient(90deg, var(--tw-accent-1) 0%, var(--tw-accent-2) 50%, var(--tw-accent-3) 100%);
    border-radius: 2px;
  }
  h2 {
    margin: 1.5rem 0 0.5rem;
    font-weight: 500; font-size: 1.65rem;
    color: var(--tw-text); letter-spacing: -0.01em;
  }
  p.sub { color: var(--tw-muted); font-size: 0.925rem; line-height: 1.55; margin: 0; }
  label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.15em; color: var(--tw-muted);
    margin: 1.75rem 0 0.5rem; font-weight: 600;
  }
  input[type="password"], input[type="text"] {
    width: 100%; padding: 0.85rem 1rem; font-size: 1rem;
    border: 1px solid #e5e7eb; border-radius: 4px; background: #f8faf5;
    font-family: inherit; outline: none;
    transition: border 0.15s ease, background 0.15s ease;
  }
  input[type="password"]:focus, input[type="text"]:focus {
    border-color: var(--tw-accent-2); background: #fff;
  }
  .row {
    margin-top: 1.15rem; display: flex; align-items: center;
    justify-content: space-between; gap: 0.75rem;
  }
  .err { color: #dc2626; font-size: 0.85rem; min-height: 1.2em; flex: 1; }
  button {
    background: var(--tw-dark); color: #fff; border: 0; cursor: pointer;
    padding: 0.75rem 1.6rem; font-weight: 500; letter-spacing: 0.02em;
    font-family: inherit; border-radius: 2px;
    transition: background 0.15s ease, transform 0.1s ease;
    font-size: 0.95rem;
  }
  button:hover { background: #333; }
  button:active { transform: translateY(1px); }
  .foot {
    margin-top: 1.75rem; font-size: 0.72rem; color: #9ca3af;
    text-align: center; letter-spacing: 0.05em;
  }
  .tagline {
    text-align: center; color: rgba(255,255,255,0.75);
    font-size: 0.78rem; letter-spacing: 0.25em; text-transform: uppercase;
    margin-bottom: 1.5rem; position: relative; z-index: 1;
  }
  .container {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 440px;
  }
  @media (max-width: 480px) {
    .card { padding: 2rem 1.5rem 1.75rem; }
    h2 { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div class="container">
  <p class="tagline">Tweak Marketing</p>
  <form class="card" autocomplete="off" id="access-form">
    <div class="brand-row">
      <span class="brand">TWEAK</span>
      <span class="brand" style="font-weight:400;">REPORTING</span>
    </div>
    <div class="accent-bar" style="max-width: 180px;"></div>
    <h2>Sign in</h2>
    <p class="sub">Enter your access code to view your reports.</p>
    <label for="pw">Access code</label>
    <input id="pw" type="password" autofocus autocomplete="off" spellcheck="false" />
    <div class="row">
      <div class="err" id="err"></div>
      <button type="submit">Unlock →</button>
    </div>
    <div class="foot">Tweak Marketing · Client Reporting Portal</div>
  </form>
</div>

<script>
  /*
   * Tweak Reporting — Access Router
   *
   * Four code types:
   *  - client:  goes straight to that client's dashboard
   *  - team:    goes to /team/ overview with their assigned clients
   *  - admin:   goes to /team/ overview showing ALL clients
   *  - manager: goes to /manager/ — team-member browser (pick a team member to view)
   *
   * NOTE: Client-side friction gate only — not real security.
   */

  // Client dashboards — one entry per client that has a dashboard folder.
  const CLIENTS = {
    'offgridpro': {
      path: './offgridpro/',
      name: 'OffGrid Pro',
      sector: 'Battery Storage & Microgrids',
      location: 'Southampton, UK',
      accountManager: 'Louise',
      latestReport: 'June 2026',
      status: 'Active',
    },
    'gfs': {
      path: './gfs/',
      name: 'GFS',
      sector: 'Logistics · eCommerce Shipping',
      location: 'UK',
      accountManager: 'Imogen',
      latestReport: 'June 2026',
      status: 'Active',
    },
    // Add more clients here as they come online:
    // 'clientslug': { path: './clientfolder/', name: 'Client Name', sector: '...', location: '...', accountManager: '...', latestReport: '...', status: 'Active' },
  };

  // Access codes — client, team, or admin.
  const CODES = {
    // Client codes: land on that client's dashboard
    'OffGrid':  { type: 'client', clientId: 'offgridpro' },
    'GFS':      { type: 'client', clientId: 'gfs' },

    // Tweak team member codes: land on team overview with their assigned clients
    'Daniela':  { type: 'team', name: 'Daniela',  role: 'Account Manager', clients: ['offgridpro'] },
    'Imogen':   { type: 'team', name: 'Imogen',   role: 'Account Manager', clients: ['gfs'] },
    'Georgia':  { type: 'team', name: 'Georgia',  role: 'Team Member',     clients: [] },
    'Daisy':    { type: 'team', name: 'Daisy',    role: 'Team Member',     clients: [] },
    'Jeremy':   { type: 'team', name: 'Jeremy',   role: 'Team Member',     clients: [] },
    'Bethany':  { type: 'team', name: 'Bethany',  role: 'Team Member',     clients: [] },

    // Tweak admin code: sees all clients + admin panel inside dashboards
    'Tweak':    { type: 'admin', name: 'Tweak Admin' },

    // Manager codes: browse the whole team, pick a team member to view their portfolio + drafts
    'Benedict': { type: 'manager', name: 'Benedict', role: 'Manager' },
    'Louise':   { type: 'manager', name: 'Louise',   role: 'Manager' },
  };

  const form = document.getElementById('access-form');
  const input = document.getElementById('pw');
  const err = document.getElementById('err');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = input.value.trim();
    const code = CODES[val];
    if (!code) {
      err.textContent = 'Incorrect code. Try again.';
      input.select();
      return;
    }
    err.textContent = '';

    // Persist which code was used so downstream pages can render context.
    try {
      sessionStorage.setItem('tw_session', JSON.stringify({
        code: val,
        type: code.type,
        name: code.name || null,
        role: code.role || null,
        clients: code.clients || null,
        ts: Date.now(),
      }));
    } catch { /* ignore */ }

    // Helper: pre-authorise every client dashboard so we never re-prompt.
    // Each client has its own storage key; add here when onboarding new clients.
    function preAuthAllClients(role) {
      const payload = JSON.stringify({ role, ts: Date.now() });
      try {
        sessionStorage.setItem('ogp_dashboard_auth', payload); // OffGrid Pro
        sessionStorage.setItem('gfs_dashboard_auth', payload); // GFS
      } catch {}
    }

    if (code.type === 'client') {
      const client = CLIENTS[code.clientId];
      if (!client) { err.textContent = 'Client not configured.'; return; }
      preAuthAllClients('client');
      window.location.href = client.path;
    } else if (code.type === 'team') {
      // Team member: go to team overview
      window.location.href = './team/';
    } else if (code.type === 'admin') {
      // Admin: go to team overview (shows all clients) and pre-auth admin on dashboards
      preAuthAllClients('admin');
      window.location.href = './team/';
    } else if (code.type === 'manager') {
      // Manager: go to manager team-browser view. Pre-auth downstream dashboards as admin
      // so they can drill into any client without being re-prompted.
      preAuthAllClients('admin');
      window.location.href = './manager/';
    }
  });
</script>

</body>
</html>
