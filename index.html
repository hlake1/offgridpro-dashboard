<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tweak Reporting — Client Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --tw-dark: #0f172a;
    --tw-text: #1a1a1a;
    --tw-muted: #666;
    --tw-accent-1: #a3c94a;
    --tw-accent-2: #4bc7bf;
    --tw-accent-3: #5aa5d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Montserrat', -apple-system, Helvetica, Arial, sans-serif;
    color: var(--tw-text);
    background:
      linear-gradient(rgba(15,23,42,0.85) 0%, rgba(10,10,10,0.92) 100%),
      linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
  }

  /* Decorative gradient orbs */
  body::before, body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.25;
    pointer-events: none;
  }
  body::before {
    width: 500px; height: 500px;
    background: var(--tw-accent-2);
    top: -100px; left: -100px;
  }
  body::after {
    width: 600px; height: 600px;
    background: var(--tw-accent-1);
    bottom: -150px; right: -150px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    color: var(--tw-text);
    border-radius: 6px;
    padding: 2.75rem 2.25rem 2.25rem;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
  }

  .brand-row {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
  }
  .brand {
    font-weight: 800;
    letter-spacing: -0.01em;
    font-size: 1.35rem;
  }
  .accent-bar {
    height: 4px;
    margin-top: 8px;
    background: linear-gradient(90deg, var(--tw-accent-1) 0%, var(--tw-accent-2) 50%, var(--tw-accent-3) 100%);
    border-radius: 2px;
  }

  h2 {
    margin: 1.5rem 0 0.5rem;
    font-weight: 500;
    font-size: 1.65rem;
    color: var(--tw-text);
    letter-spacing: -0.01em;
  }
  p.sub {
    color: var(--tw-muted);
    font-size: 0.925rem;
    line-height: 1.55;
    margin: 0;
  }

  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--tw-muted);
    margin: 1.75rem 0 0.5rem;
    font-weight: 600;
  }

  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 4px;
    background: #f8faf5;
    font-family: inherit;
    outline: none;
    transition: border 0.15s ease, background 0.15s ease;
  }
  input[type="password"]:focus, input[type="text"]:focus {
    border-color: var(--tw-accent-2);
    background: #fff;
  }

  .row {
    margin-top: 1.15rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
  }
  .err {
    color: #dc2626;
    font-size: 0.85rem;
    min-height: 1.2em;
    flex: 1;
  }

  button {
    background: var(--tw-dark);
    color: #fff;
    border: 0;
    cursor: pointer;
    padding: 0.75rem 1.6rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    font-family: inherit;
    border-radius: 2px;
    transition: background 0.15s ease, transform 0.1s ease;
    font-size: 0.95rem;
  }
  button:hover { background: #333; }
  button:active { transform: translateY(1px); }

  .foot {
    margin-top: 1.75rem;
    font-size: 0.72rem;
    color: #9ca3af;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .tagline {
    text-align: center;
    color: rgba(255,255,255,0.75);
    font-size: 0.78rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    position: relative;
    z-index: 1;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 440px;
  }

  @media (max-width: 480px) {
    .card { padding: 2rem 1.5rem 1.75rem; }
    h2 { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<div class="container">
  <p class="tagline">Tweak Marketing</p>
  <form class="card" autocomplete="off" id="access-form">
    <div class="brand-row">
      <span class="brand">TWEAK</span>
      <span class="brand" style="font-weight:400;">REPORTING</span>
    </div>
    <div class="accent-bar" style="max-width: 180px;"></div>
    <h2>Client access</h2>
    <p class="sub">Enter your access code to view your performance reports.</p>
    <label for="pw">Access code</label>
    <input id="pw" type="password" autofocus autocomplete="off" spellcheck="false" />
    <div class="row">
      <div class="err" id="err"></div>
      <button type="submit">Unlock →</button>
    </div>
    <div class="foot">Tweak Marketing · Client Reporting Portal</div>
  </form>
</div>

<script>
  /*
   * Tweak Reporting — Client Access
   *
   * Each client has an access code that routes them to their dashboard.
   * Add new clients by adding an entry to CLIENTS below.
   *
   * NOTE: This is a friction gate for a prototype, not real security.
   * Any real access control must be enforced server-side.
   */
  const CLIENTS = {
    // client code → dashboard path
    'OffGrid':  { path: './offgridpro/',  name: 'OffGrid Pro' },
    // Tweak admin code — also lands on OffGrid Pro for now (unlocks admin panel there).
    'Tweak':    { path: './offgridpro/',  name: 'Tweak Admin' },
    // Add more clients here as they come online:
    // 'ClientName': { path: './clientfolder/', name: 'Full Client Name' },
  };

  const form = document.getElementById('access-form');
  const input = document.getElementById('pw');
  const err = document.getElementById('err');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = input.value.trim();
    const client = CLIENTS[val];
    if (!client) {
      err.textContent = 'Incorrect code. Try again.';
      input.select();
      return;
    }
    // Pre-authorise the target dashboard so it doesn't re-prompt.
    // The OffGrid Pro dashboard uses sessionStorage key `ogp_da…auth` with
    // role `client` or `admin`. Set it here so users go straight in.
    try {
      const role = (val === 'Tweak') ? 'admin' : 'client';
      sessionStorage.setItem('ogp_da…auth', JSON.stringify({ role, ts: Date.now() }));
    } catch { /* ignore */ }
    err.textContent = '';
    window.location.href = client.path;
  });
</script>

</body>
</html>
