name: Refresh Google Ads data

# Pulls live Google Ads data from Maton and commits data.json back to the repo.
# READ-ONLY: this workflow only reads campaign/keyword/search-term data. It never
# mutates any Google Ads resources.

on:
  # Manual trigger from the Actions tab
  workflow_dispatch:
    inputs:
      period:
        description: "Period: 'live' / 'last-28-days' / 'last-N-days' / 'prev-month' / 'YYYY-MM'. Defaults to 'live' (last 28 days)."
        required: false
        type: string
        default: 'live'

  # Automatic — daily at 06:00 UTC (07:00 UK BST / 06:00 GMT)
  # Change frequency here later if Herbie/Daniela want faster/slower refresh.
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull Google Ads data (last 28 days rolling window)
        env:
          MATON_API_KEY: ${{ secrets.MATON_API_KEY }}
        run: |
          # Default to the rolling last-28-days window that the Live Metrics
          # dashboard reads from offgridpro/live/data.json. Operators can pass
          # any other period via workflow_dispatch (e.g. '2026-07' for a
          # specific month, or 'last-14-days' for a shorter rolling window).
          PERIOD="${{ github.event.inputs.period }}"
          if [ -z "$PERIOD" ]; then
            PERIOD="live"
          fi
          echo "Refreshing for period: $PERIOD"
          node scripts/pull-google-ads.js "$PERIOD"

      - name: Commit changes if any
        run: |
          git config user.name "offgridpro-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh Google Ads data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
